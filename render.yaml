services:
  - type: web
    name: pdf-chatbot-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: ./app/Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: pdf-chatbot-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DOCUMENT_UPLOAD_DIR
        value: /app/uploads
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pdf-chatbot-redis
          property: connectionString

  - type: keyvalue
    name: pdf-chatbot-redis
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
